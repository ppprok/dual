# CI for the dual library (#14). Every job can be reproduced locally; see the "CI" section of
# CLAUDE.md and the build-and-test skill.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }} ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release]
        name: [linux-gcc, linux-clang, macos, windows-msvc]
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macos
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: windows-msvc
            os: windows-latest
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      # The presets use Ninja, so cl.exe has to be on PATH (a Developer Command Prompt environment).
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # doctest is fetched by FetchContent at configure time (a shallow clone of one tag); it is not
      # cached because the clone is about as fast as restoring a cache.
      - name: Install Ninja
        run: pipx install ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # Includes the dual_consumer test: install + find_package(dual) from a scratch prefix.
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  asan:
    name: linux-gcc asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: pipx install ninja
      # ASan aborts at startup with the high mmap randomization of recent runner kernels.
      - name: Lower mmap randomization for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan

  coverage:
    name: linux-gcc coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same gcovr as on the dev machine (uv tool install gcovr); it reads gcovr.cfg.
      - name: Install Ninja and gcovr
        run: pip install ninja gcovr==8.7
      - name: Configure
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      # Test discovery runs the test binaries during the build; drop those counts before ctest.
      - name: Test
        run: |
          find build/coverage -name '*.gcda' -delete
          ctest --preset coverage
      # Informational: the job fails only if the build or a test fails, not on a threshold.
      - name: Coverage report
        run: |
          mkdir -p build/coverage-report
          gcovr build/coverage --txt build/coverage-report/coverage.txt \
            --html-details build/coverage-report/index.html | tee build/coverage-report/summary.txt
          cat build/coverage-report/coverage.txt
          {
            echo '### Coverage of src/common, src/dual, include/dual'
            echo '```'
            cat build/coverage-report/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-report
          retention-days: 14

  docs:
    name: docs (Doxygen, warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen
      - name: Build the API documentation
        run: |
          doxygen --version
          mkdir -p build
          printf '@INCLUDE = docs/Doxyfile\nWARN_AS_ERROR = FAIL_ON_WARNINGS\n' > build/Doxyfile.ci
          doxygen build/Doxyfile.ci

  clang-format:
    name: clang-format (changed lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same clang-format as on the dev machine (uv tool install clang-format).
      - name: Install clang-format
        run: pip install clang-format==23.1.3
      # Only lines changed by the PR (or by the pushed commits) are checked, so code that predates
      # the formatting pass does not fail the job. legacy/ is never formatted.
      - name: Check formatting of changed lines
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          BASE=$(git merge-base "$BASE" HEAD)
          echo "Checking lines changed since $BASE"
          # clang-format-diff.py exits with 1 and prints the fix when a changed line is misformatted.
          git diff -U0 --no-color "$BASE" -- '*.cpp' '*.cc' '*.cxx' '*.h' '*.hpp' ':(exclude)legacy' \
            | clang-format-diff.py -p1 -binary "$(command -v clang-format)" \
            || { echo "::error::Changed lines are not clang-formatted. Fix with: git clang-format $BASE"; exit 1; }
          echo "Changed lines are clang-formatted."

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same clang-tidy as on the dev machine (uv tool install clang-tidy); the wheel also ships
      # run-clang-tidy.py. Live code is clean (#12), so any finding fails the job.
      - name: Install clang-tidy and Ninja
        run: pip install clang-tidy==23.1.3 ninja
      # Only compile_commands.json (and the fetched doctest headers) are needed, no build.
      - name: Configure
        run: cmake --preset dev
      - name: Run clang-tidy on live code
        run: |
          clang-tidy --version
          run-clang-tidy.py -p build/dev -quiet -warnings-as-errors='*' 'src/(common|dual|tests)/'

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      # The Python package arrives with #13 (pyproject.toml + python/tests); until then the job
      # only reports that there is nothing to test.
      - name: Check for the Python package
        if: hashFiles('pyproject.toml') == ''
        run: echo "::notice::No pyproject.toml yet (#13), skipping the Python job."
      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        if: hashFiles('pyproject.toml') != ''
        run: python -m pip install ".[test]" pytest
      - name: Run pytest
        if: hashFiles('pyproject.toml') != ''
        run: python -m pytest python/tests
