# Publishes the Doxygen API documentation to GitHub Pages (#15): https://ppprok.github.io/dual/
# Needs Settings -> Pages -> Source: GitHub Actions. Pull requests are checked by the docs job of ci.yml.
name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push does not cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Doxygen HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen
      # docs/Doxyfile writes to build/docs/html (paths relative to the repository root).
      - name: Build the API documentation
        run: |
          doxygen --version
          mkdir -p build/docs
          doxygen docs/Doxyfile
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
