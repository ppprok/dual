# gcovr settings for the coverage preset (#47). From the repository root:
#   cmake --preset coverage && cmake --build --preset coverage
#   find build/coverage -name '*.gcda' -delete && ctest --preset coverage
#   gcovr build/coverage
# Reports the library code only (src/common, src/dual, include/dual), not the tests.
root = .
filter = src/common/
filter = src/dual/
filter = include/dual/
exclude-throw-branches = yes
exclude-unreachable-branches = yes
print-summary = yes
